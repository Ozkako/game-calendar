name: auto-update-calendar
on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 北京时间每天 00:00
  workflow_dispatch:        # 允许手动触发
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取并更新活动数据
        run: python update_calendar.py --fetch || python update_calendar.py
      - name: 提交更新
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add events.json calendar.ics
          git diff --cached --quiet || git commit -m "chore: 自动更新活动数据 $(date +%F)"
          git push
