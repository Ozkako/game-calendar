<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二游活动日历</title>
<style>
:root{
  --bg:#fff;--text:#1a1a1a;--text2:#555;--text3:#888;--text4:#b0b0b0;
  --border:#e6e6e6;--muted:#f6f6f6;
  --c-genshin:#3b6fe0;--c-hsr:#7a5af8;--c-zzz:#e5484d;--c-wuwa:#30a46c;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141414;--text:#eee;--text2:#c9c9c9;--text3:#999;--text4:#5f5f5f;
        --border:#2e2e2e;--muted:#1f1f1f;}
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:19px;font-weight:600;margin:0}
.sub{font-size:12px;color:var(--text3);margin-top:2px}
.hd{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.ttl{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.nav{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer;font-size:14px}
.nav:hover{background:var(--muted)}
.today{margin-left:auto;height:28px;padding:0 10px;border-radius:8px;
  border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:12px}
.sub2{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer;font-size:12px;text-decoration:none;
  display:inline-flex;align-items:center}
.wks{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.wks span{font-size:11px;color:var(--text3);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);
  border-top:.5px solid var(--border);border-left:.5px solid var(--border)}
.cell{min-height:62px;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);
  padding:3px 4px;cursor:pointer}
.cell:hover{background:var(--muted)}
.num{display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;
  font-size:12px;font-variant-numeric:tabular-nums;border-radius:8px;color:var(--text2)}
.dim .num{color:var(--text4)}
.now .num{background:var(--text);color:var(--bg)}
.sel{background:var(--muted)}
.chip{display:block;font-size:10px;line-height:1.3;padding:1px 4px;margin-top:2px;
  border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--gc) 14%,transparent);color:var(--gc)}
@supports not (background:color-mix(in srgb,red 10%,white)){
  .chip{background:var(--gc);color:#fff}
}
.more{font-size:10px;color:var(--text4);margin-top:2px}
.flt{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fg{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;
  border-radius:6px;border:1px solid var(--border);background:transparent;cursor:pointer;
  font-size:12px;color:var(--text)}
.fg i{width:7px;height:7px;border-radius:4px;background:var(--gc)}
.fg.off{opacity:.32}
.dtl{border-top:.5px solid var(--border);padding-top:8px}
.dth{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:.5px solid var(--border)}
.row i{width:7px;height:7px;border-radius:4px;background:var(--gc);flex:none;align-self:center}
.gn{font-size:11px;color:var(--text3);flex:none;width:70px}
.tt{font-size:13px;flex:1}
.tp{font-size:11px;color:var(--text4);flex:none;font-variant-numeric:tabular-nums}
.none{font-size:12px;color:var(--text4);padding:6px 0}
.ft{margin-top:12px;font-size:11px;color:var(--text4)}
a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>二游活动日历</h1>
  <div class="sub">原神 · 星穹铁道 · 绝区零 · 鸣潮 ｜ 数据每日自动更新</div>
  <div class="hd">
    <button class="nav" id="pv">‹</button>
    <span class="ttl" id="ttl"></span>
    <button class="nav" id="nx">›</button>
    <a class="sub2" href="calendar.ics">订阅到手机日历</a>
    <button class="today" id="td">回到今天</button>
  </div>
  <div class="wks"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
  <div class="grid" id="g"></div>
  <div class="flt" id="f"></div>
  <div class="dtl" id="d"></div>
  <div class="ft">点按日期查看当天活动 · 点开「订阅到手机日历」可把活动同步进系统日历</div>
</div>
<script>
var G={genshin:{n:'原神',c:'var(--c-genshin)'},hsr:{n:'星穹铁道',c:'var(--c-hsr)'},zzz:{n:'绝区零',c:'var(--c-zzz)'},wuwa:{n:'鸣潮',c:'var(--c-wuwa)'}};
var E=[
{g:'genshin',s:'2026-11-05',e:'2026-11-05',t:'7.2版本更新（至冬·新区域开放）',p:'版本'},
{g:'genshin',s:'2026-11-16',e:'2026-11-16',t:'「僭越者的试炼」活动开启',p:'活动'},
{g:'hsr',s:'2026-11-11',e:'2026-11-11',t:'4.7版本上线 · 星神「阿哈」实装',p:'版本'},
{g:'hsr',s:'2026-11-11',e:'2026-12-01',t:'「寰宇美学·幻乐秀场」时装抽取',p:'卡池'},
{g:'hsr',s:'2026-11-12',e:'2026-11-12',t:'听歌领80星琼 · 音乐活动',p:'网页'},
{g:'zzz',s:'2026-11-11',e:'2026-12-01',t:'签到「『嗯呢』从天降」（10邦布券）',p:'签到'},
{g:'zzz',s:'2026-11-11',e:'2026-11-30',t:'「跛脚乌鸦奇踪记」',p:'活动'},
{g:'zzz',s:'2026-11-11',e:'2026-12-01',t:'3.3下半卡池：赛维里安 / 诺姆',p:'卡池'},
{g:'zzz',s:'2026-11-11',e:'2026-12-02',t:'赛维里安时装「肃仪无犯」限时折扣',p:'商城'},
{g:'zzz',s:'2026-11-16',e:'2026-11-30',t:'「修复吧！漂流画集」',p:'活动'},
{g:'zzz',s:'2026-11-20',e:'2026-11-20',t:'3.4「长日终尽」前瞻直播 18:30（含兑换码）',p:'直播'},
{g:'zzz',s:'2026-11-27',e:'2026-11-29',t:'Zenless LIVE 2026 FES专场（杭州·线下）',p:'线下'},
{g:'wuwa',s:'2026-11-09',e:'2026-11-09',t:'逆境深塔更新',p:'周期玩法'},
{g:'wuwa',s:'2026-11-12',e:'2026-11-12',t:'3.8「旧梦凋零的百合」· 新共鸣者「莉莉」',p:'版本'},
{g:'wuwa',s:'2026-11-12',e:'2026-11-12',t:'3.8上半卡池：西格莉卡 / 仇远（复刻）',p:'卡池'},
{g:'wuwa',s:'2026-11-19',e:'2026-11-19',t:'终焉矩阵更新',p:'周期玩法'},
{g:'wuwa',s:'2026-11-23',e:'2026-11-23',t:'冥歌海墟更新',p:'周期玩法'}
];
var CUR=null,SEL=null,HID={},TODAY=null;
function pad(n){return (n<10?'0':'')+n}
function fmt(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function boot(){
  var n=new Date();TODAY=fmt(n.getFullYear(),n.getMonth()+1,n.getDate());
  CUR={y:n.getFullYear(),m:n.getMonth()+1};SEL=TODAY;
  fetch('events.json').then(function(r){return r.json()}).then(function(j){
    if(j&&j.events&&j.events.length){E=j.events}
    render();
  }).catch(render);
}
function evsOn(ds){return E.filter(function(x){return !HID[x.g]&&x.s<=ds&&ds<=x.e})}
function render(){
  document.getElementById('ttl').textContent=CUR.y+'年'+CUR.m+'月';
  var first=new Date(CUR.y,CUR.m-1,1),start=new Date(first);
  start.setDate(first.getDate()-((first.getDay()+6)%7));
  var h='';
  for(var i=0;i<42;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);
    var ds=fmt(d.getFullYear(),d.getMonth()+1,d.getDate());
    h+='<div class="cell'+((d.getMonth()+1)!==CUR.m?' dim':'')+(ds===TODAY?' now':'')+(ds===SEL?' sel':'')+'" data-d="'+ds+'"><span class="num">'+d.getDate()+'</span>';
    var ev=evsOn(ds);
    ev.slice(0,2).forEach(function(x){
      h+='<span class="chip" style="--gc:'+G[x.g].c+'">'+x.t+'</span>';
    });
    if(ev.length>2)h+='<div class="more">还有 '+(ev.length-2)+' 个</div>';
    h+='</div>';
  }
  document.getElementById('g').innerHTML=h;
  var fh='';
  Object.keys(G).forEach(function(k){
    fh+='<button class="fg'+(HID[k]?' off':'')+'" data-k="'+k+'" style="--gc:'+G[k].c+'"><i></i>'+G[k].n+'</button>';
  });
  document.getElementById('f').innerHTML=fh;
  var de=evsOn(SEL);
  var dh='<div class="dth">'+SEL+'（'+['周日','周一','周二','周三','周四','周五','周六'][new Date(SEL+'T00:00:00').getDay()]+'）</div>';
  if(!de.length)dh+='<div class="none">这一天没有记录的活动，安心清体力～</div>';
  de.forEach(function(x){
    var tp=x.s===x.e?'':x.s.slice(5)+' ~ '+x.e.slice(5);
    dh+='<div class="row" style="--gc:'+G[x.g].c+'"><i></i><span class="gn">'+G[x.g].n+'</span><span class="tt">'+x.t+'</span><span class="tp">'+tp+'</span></div>';
  });
  document.getElementById('d').innerHTML=dh;
  document.querySelectorAll('.cell').forEach(function(c){
    c.onclick=function(){SEL=c.getAttribute('data-d');render()};
  });
  document.querySelectorAll('.fg').forEach(function(b){
    b.onclick=function(){var k=b.getAttribute('data-k');HID[k]=!HID[k];render()};
  });
}
document.getElementById('pv').onclick=function(){CUR.m--;if(CUR.m<1){CUR.m=12;CUR.y--}render()};
document.getElementById('nx').onclick=function(){CUR.m++;if(CUR.m>12){CUR.m=1;CUR.y++}render()};
document.getElementById('td').onclick=function(){var n=new Date();CUR={y:n.getFullYear(),m:n.getMonth()+1};SEL=TODAY;render()};
boot();
</script>
</body>
</html>
